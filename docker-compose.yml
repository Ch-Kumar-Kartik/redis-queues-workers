services:
  redis:
    image: redis:7-alpine
    container_name: redis-learn
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongo:
    image: mongo:7
    container_name: mongo-learn
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redis_learn_db
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data:
